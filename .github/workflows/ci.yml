name: AP Creative Tools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ap-tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Catalog, tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete project checks
        run: npm run check

      - name: Verify production output
        run: test -s dist/index.html && test -s dist/sitemap.xml
