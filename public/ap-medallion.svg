<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AP Creative Tools</title><desc id="desc">The supplied metallic AP circuit medallion with animated green circuit pulses.</desc>
<defs>
 <clipPath id="badgeClip"><circle cx="256" cy="256" r="255"/></clipPath>
 <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .circuit{fill:none;stroke:#7dff8c;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34;stroke-dashoffset:0;opacity:0;filter:url(#greenGlow);animation:current-flow 3.6s linear infinite, circuit-glow 2.4s ease-in-out infinite alternate}
 .circuit.slow{animation-duration:5s,2.9s;animation-delay:-1.8s,.4s}
 .node{fill:#a4ff9b;opacity:0;filter:url(#greenGlow);animation:node-pulse 2.1s ease-in-out infinite}
 @keyframes current-flow{to{stroke-dashoffset:-144}}
 @keyframes circuit-glow{0%{opacity:.08}40%{opacity:.9}100%{opacity:.18}}
 @keyframes node-pulse{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.95;transform:scale(1.5)}}
 @media(prefers-reduced-motion:reduce){.circuit,.node{animation:none;opacity:.28}}
 </style>
</defs>
<g clip-path="url(#badgeClip)">
 <image x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,"/>
 <g filter="url(#greenGlow)">
  <path class="circuit" d="M85 164 H124 V137 H165 V105 H211 M91 228 H135 V204 H163 V177 H187 M72 294 H115 V322 H156 V350 H190 M107 381 H146 V404 H182 V430 H215 M426 153 H388 V126 H350 V98 H315 M440 225 H402 V202 H372 V178 H344 M442 294 H402 V321 H370 V349 H336 M411 380 H376 V407 H342 V432 H309"/>
  <path class="circuit slow" d="M118 92 V123 H148 V148 H177 M394 91 V119 H366 V144 H337 M83 345 H119 V370 H152 M430 348 H394 V372 H363"/>
  <circle class="node" cx="165" cy="105" r="4"/><circle class="node" cx="187" cy="177" r="4"/><circle class="node" cx="156" cy="350" r="4"/><circle class="node" cx="182" cy="430" r="4"/><circle class="node" cx="350" cy="98" r="4"/><circle class="node" cx="344" cy="178" r="4"/><circle class="node" cx="370" cy="349" r="4"/><circle class="node" cx="342" cy="432" r="4"/>
 </g>
</g></svg>