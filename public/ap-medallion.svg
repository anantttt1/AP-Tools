<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AP Creative Studio</title><desc id="desc">Metallic silver AP monogram on a dark circular circuit-board medallion.</desc>
<defs>
 <linearGradient id="ap-water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#c8f1ff"/><stop offset=".62" stop-color="#63b9e8"/><stop offset="1" stop-color="#dff8ff"/></linearGradient>
 <linearGradient id="ap-sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#d9f4ff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="ap-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .ap-medallion-art{transform-box:fill-box;transform-origin:center;opacity:0;animation:ap-logo-settle 1.45s cubic-bezier(.18,.82,.22,1) .12s forwards}
 .ap-water-burst{transform-box:fill-box;transform-origin:center;opacity:0;animation:ap-water-bloom 1.9s cubic-bezier(.16,.72,.2,1) both}
 .ap-water-ring{fill:none;stroke:url(#ap-water);stroke-width:8;stroke-linecap:round;opacity:0;filter:url(#ap-glow);animation:ap-water-ring 2.2s cubic-bezier(.12,.7,.2,1) both}
 .ap-water-drops{fill:url(#ap-water);stroke:#fff;stroke-opacity:.7;stroke-width:2;filter:url(#ap-glow);opacity:0;animation:ap-water-drops 1.8s cubic-bezier(.15,.72,.2,1) both}
 .ap-logo-sheen{fill:url(#ap-sheen);opacity:0;transform:translateX(-560px);animation:ap-sheen-pass 7.5s ease-in-out 1.9s infinite}
 @keyframes ap-logo-settle{0%{opacity:0;transform:scale(.72) rotate(-13deg)}62%{opacity:1;transform:scale(1.035) rotate(1.4deg)}82%{transform:scale(.988) rotate(-.5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
 @keyframes ap-water-bloom{0%{opacity:0;transform:scale(.42)}18%{opacity:.96}58%{opacity:.76;transform:scale(1.08)}100%{opacity:0;transform:scale(1.22)}}
 @keyframes ap-water-ring{0%{opacity:0;stroke-width:15;transform:scale(.78)}22%{opacity:.9}100%{opacity:0;stroke-width:1.5;transform:scale(1.22)}}
 @keyframes ap-water-drops{0%{opacity:0;transform:scale(.3)}18%{opacity:1}68%{opacity:.9}100%{opacity:0;transform:scale(1.2) translateY(-5px)}}
 @keyframes ap-sheen-pass{0%,68%{opacity:0;transform:translateX(-560px)}73%{opacity:.42}82%{opacity:.2;transform:translateX(560px)}83%,100%{opacity:0;transform:translateX(560px)}}
 @media(prefers-reduced-motion:reduce){.ap-medallion-art,.ap-water-burst,.ap-water-ring,.ap-water-drops,.ap-logo-sheen{animation:none!important;opacity:1!important;transform:none!important}}
 </style>
</defs>
<defs>
 <radialGradient id="core" cx="48%" cy="34%" r="72%"><stop stop-color="#202633"/><stop offset=".58" stop-color="#090d15"/><stop offset="1" stop-color="#020409"/></radialGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".14" stop-color="#7c8490"/><stop offset=".29" stop-color="#f8fbff"/><stop offset=".48" stop-color="#555d69"/><stop offset=".68" stop-color="#e8edf4"/><stop offset=".84" stop-color="#737b88"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
